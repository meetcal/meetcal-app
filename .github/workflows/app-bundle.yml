name: App Bundle

on:
  push:
    branches: [main, master]
    paths: ["src/**", "assets/**", "metro/**", "patches/**", "package.json", "bun.lock", "app.config.js", "metro.config.js", "babel.config.js", "tsconfig.json", "scripts/bundle/**", "scripts/check-bundle.ts", ".github/workflows/app-bundle.yml"]
  pull_request:
    paths: ["src/**", "assets/**", "metro/**", "patches/**", "package.json", "bun.lock", "app.config.js", "metro.config.js", "babel.config.js", "tsconfig.json", "scripts/bundle/**", "scripts/check-bundle.ts", ".github/workflows/app-bundle.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: iOS bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export the iOS bundle and check its budget
        run: bun scripts/check-bundle.ts
