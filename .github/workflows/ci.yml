name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths-ignore: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests and coverage
        run: bun run test:coverage

      - name: Coverage inventory
        run: bun .codex/skills/review-code-performance-tests/scripts/report-coverage-gaps.ts
