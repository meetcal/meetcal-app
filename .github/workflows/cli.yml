name: CLI CI

# The CLI in `cli/` reads the Convex functions in `convex/`, so a change to
# either runs it.
on:
  push:
    branches: [main, master]
    paths: ["cli/**", "convex/**", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["cli/**", "convex/**", ".github/workflows/cli.yml"]
  # Advisories are published without any change here, so audit the lockfile weekly too.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cli

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # The Rust in cli/ and web/ mise.toml: CI lints and builds with the same release.
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # The Rust in cli/ and web/ mise.toml: CI lints and builds with the same release.
          toolchain: "1.99.1"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Unsound and yanked crates fail too, not only vulnerabilities: the release binaries carry
      # whatever this lockfile holds. (Unmaintained crates only warn.)
      - name: Audit Rust dependencies
        run: cargo audit --deny unsound --deny yanked
