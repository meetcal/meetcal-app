name: Entry Scrapers

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: 'https://usaweightlifting.sport80.com/public/events/14711/entries/21593?bl='
            name: 2026 Ohio WSO Championships
          - url: 'https://usaweightlifting.sport80.com/public/events/14508/entries/21398?bl='
            name: 2026 Virus Weightlifting Series 2, Powered by Rogue Fitness
          - url: 'https://usaweightlifting.sport80.com/public/events/14372/entries/21259?bl=locator'
            name: 2026 USA Weightlifting National Championships, Powered by Rogue Fitness
          - url: 'https://usaweightlifting.sport80.com/public/events/14473/entries/21359?bl='
            name: 2026 Mountain North WSO Championships
          - url: 'https://usaweightlifting.sport80.com/public/events/14712/entries/21595?bl='
            name: 2026 Florida State Championships (WSO Championships) 
          - url: 'https://usaweightlifting.sport80.com/public/events/14522/entries/21416?bl='
            name: 2026 New York State WSO Championships
          - url: 'https://usaweightlifting.sport80.com/public/events/14725/entries/21608?bl='
            name: 2026 New England WSO Championships
          - url: 'https://usaweightlifting.sport80.com/public/events/14723/entries/21606?bl='
            name: 2026 Pacific Northwest WSO Championships
          - url: 'https://usaweightlifting.sport80.com/public/events/14772/entries/21653?bl='
            name: 2026 Tennesse-Kentucky WSO Championship
          - url: 'https://usaweightlifting.sport80.com/public/events/14510/entries/21402?bl='
            name: 2026 Virus Weightlifting Finals, Powered by Rogue Fitness
          - url: 'https://usaweightlifting.sport80.com/public/events/14849/entries/21724?bl=locator'
            name: 2026 Carolina WSO Championship
    defaults:
      run:
        working-directory: ./scrapers/usaw/entry_scraper
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Create URL file
        run: echo "${{ matrix.url }}" > target_url.txt

      - name: Run scraper (${{ matrix.name }})
        run: node csv_scraper.js
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ENTRY_WEBHOOK_URL }}
