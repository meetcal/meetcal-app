name: Fuzz (nightly)

# The property and chaos suites (`*.property.test.ts`, `*.chaos.test.ts`) run
# 100 cases each in the PR gate. Here they run thousands, with a fresh seed,
# to find what the gate's sample misses. A failure opens an issue linking
# the run; the log holds the seed and shrink path to replay it (see
# docs/testing.md).

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      num_runs:
        description: "Cases per property"
        default: "2000"

permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Property and chaos suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run property and chaos suites
        env:
          FC_NUM_RUNS: ${{ inputs.num_runs || '2000' }}
        run: bunx jest --ci --watchman=false --testTimeout=1200000 --testPathPattern '\.(property|chaos)\.test\.tsx?$'

      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Nightly fuzz failure $(date -u +%Y-%m-%d)" \
            --body "A property or chaos test failed in $RUN_URL. The log shows the counterexample and the seed and path to replay it: \`FC_SEED=<seed> FC_PATH=<path> bunx jest --ci --watchman=false <file>\`."
