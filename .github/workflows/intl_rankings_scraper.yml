name: International Rankings Scraper

on:
  schedule:
    # Run daily at 4:00 AM UTC
    - cron: '00 4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scrapers/usaw/rankings_scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/usaw/rankings_scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          SLACK_RANKINGS_WEBHOOK_URL: ${{ secrets.SLACK_RANKINGS_WEBHOOK_URL }}
        run: |
          python intl_rankings_scraper.py --all
