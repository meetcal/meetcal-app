name: Meets Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WSO
            script: scripts/sync-meets.js
          - name: Nationals
            script: scripts/sync-nat-meets.js
          - name: Virus Series
            script: scripts/sync-virus-meets.js
    defaults:
      run:
        working-directory: ./scrapers/usaw/meet_to_supabase
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run sync (${{ matrix.name }})
        run: node ${{ matrix.script }}
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MEET_WEBHOOK_URL }}
