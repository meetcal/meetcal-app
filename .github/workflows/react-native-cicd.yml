name: React Native CI/CD

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - prod-aab
          - ios-prod
          - publish-expo
          - publish-stores
          - all
      platform:
        type: choice
        description: "Platform to build"
        default: "all"
        options:
          - android
          - ios
          - all

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
  EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
  EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
  GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  test:
    needs: check-skip
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧪 Run TypeScript check
        run: bunx tsc

      - name: 🧹 Run ESLint
        run: bun run lint

      - name: 📢 Notify test results
        if: always()
        uses: stegzilla/discord-notify@v2
        with:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          colour: ${{ job.status == 'success' && 'good' || 'danger' }}
          title: Test Results
          message: Tests ${{ job.status == 'success' && 'passed ✅' || 'failed ❌' }}

  setup-matrix:
    runs-on: ubuntu-latest
    needs: check-skip
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.buildType != 'publish-expo')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.platform }}" = "android" ]; then
            echo 'matrix={"include":[{"platform":"android","runs-on":"ubuntu-latest"}]}' >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.platform }}" = "ios" ]; then
            echo 'matrix={"include":[{"platform":"ios","runs-on":"macos-latest"}]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"include":[{"platform":"android","runs-on":"ubuntu-latest"},{"platform":"ios","runs-on":"macos-latest"}]}' >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    needs: [check-skip, setup-matrix]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.buildType != 'publish-expo')
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install -g eas-cli@latest

      - name: 📱 Setup EAS build cache
        uses: actions/cache@v3
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-eas-build-local-

      - name: 🔄 Verify EAS CLI installation
        run: |
          echo "EAS CLI version:"
          eas --version

      - name: 📋 Verify project configuration
        run: |
          echo "Verifying package.json configuration..."
          if [ -f ./package.json ]; then
            echo "Package.json found"
            cat package.json | grep "main"
          else
            echo "package.json not found"
            exit 1
          fi

      - name: 📋 Verify metro configuration
        run: |
          if [ -f ./metro.config.js ]; then
            echo "Metro configuration found"
            head -5 ./metro.config.js
          else
            echo "Warning: metro.config.js not found"
          fi

      - name: 🔧 Select Xcode 26
        if: matrix.platform == 'ios'
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: 📱 Build Production AAB
        if: matrix.platform == 'android' && (github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-aab' || github.event_name == 'push')
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          eas build --platform android --profile production --local --non-interactive --output=./app-prod.aab
        env:
          NODE_ENV: production

      - name: 📱 Build iOS Production
        if: matrix.platform == 'ios' && (github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'ios-prod' || github.event_name == 'push')
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          eas build --platform ios --profile production --local --non-interactive --output=./app-ios-prod.ipa
        env:
          NODE_ENV: production

      - name: 🚀 Submit to Play Store
        if: matrix.platform == 'android' && (github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'publish-stores' || github.event_name == 'push')
        run: |
          eas submit -p android --path ./app-prod.aab --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}

      - name: 🚀 Submit to App Store
        if: matrix.platform == 'ios' && (github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'publish-stores' || github.event_name == 'push')
        run: |
          eas submit -p ios --path ./app-ios-prod.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}

      - name: 📦 Upload build artifacts to GitHub
        if: (matrix.platform == 'android' && (github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-aab' || github.event.inputs.buildType == 'publish-stores' || github.event_name == 'push')) || (matrix.platform == 'ios' && (github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'ios-prod' || github.event.inputs.buildType == 'publish-stores' || github.event_name == 'push'))
        uses: actions/upload-artifact@v4
        with:
          name: app-builds-${{ matrix.platform }}
          path: ${{ matrix.platform == 'android' && './app-prod.aab' || './app-ios-prod.ipa' }}
          retention-days: 7

      - name: 📢 Notify build completion
        if: always()
        uses: stegzilla/discord-notify@v2
        with:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          title: Build Results
          colour: ${{ job.status == 'success' && 'good' || 'danger' }}
          message: Build for ${{ matrix.platform }} ${{ job.status == 'success' && 'completed successfully ✅' || 'failed ❌' }}

  publish-expo-update:
    needs: check-skip
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.buildType == 'publish-expo'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install -g eas-cli@latest

      - name: 🚀 Publish EAS Update
        run: eas update --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📢 Notify publish completion
        if: always()
        uses: stegzilla/discord-notify@v2
        with:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          title: EAS Update
          colour: ${{ job.status == 'success' && 'good' || 'danger' }}
          message: OTA update ${{ job.status == 'success' && 'published ✅' || 'failed ❌' }}
