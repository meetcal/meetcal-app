name: Records Scraper

on:
  schedule:
    # Run daily at 8:00 AM UTC (3:00 AM EST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scrapers/usaw/records_scraper
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run scraper
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          SLACK_RECORDS_WEBHOOK_URL: ${{ secrets.SLACK_RECORDS_WEBHOOK_URL }}
        run: |
          python records_scraper.py

