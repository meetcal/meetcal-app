name: USAW Sport80 to Convex

on:
  schedule:
    - cron: '0 4 * * *'  # Every day at 2am UTC
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scrapers/usaw/sport80_api
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run update script
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RESULTS_WEBHOOK_URL }}
        run: python update_supabase_from_sport80.py
