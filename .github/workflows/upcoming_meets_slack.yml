name: Upcoming Meets Slack Digest

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send upcoming meets to Slack
        run: node scrapers/upcoming-meets-slack/slack-upcoming-meets.js
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SLACK_MEET_WEBHOOK_URL: ${{ secrets.SLACK_MEET_WEBHOOK_URL }}
