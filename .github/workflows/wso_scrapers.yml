name: WSO Records Scrapers

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DMV
            script: auto_scrapers/scraper_dmv.py
            args: '--wso "DMV" --sheet-url "https://docs.google.com/spreadsheets/d/1vYD2H6si9FyEO-Tc24DoFZOmST0r5hCn/edit?gid=799684986#gid=799684986"'
          - name: Florida
            script: auto_scrapers/scraper_florida.py
            args: '--wso "Florida" --sheet-url "https://docs.google.com/spreadsheets/d/16sNrOTnGrGeXE4L5skgCfE5vLTA7ggpaHWfMQNh0DfQ/view?gid=490899077#gid=490899077"'
          - name: Tennessee-Kentucky
            script: auto_scrapers/scraper_tnky.py
            args: '--wso "Tennessee-Kentucky" --sheet-url "https://docs.google.com/spreadsheets/d/11uUA0t05sEvHRjvDksC0VP1Yr2p_rC0JjHgVPEuYzhU/view?gid=867133960#gid=867133960"'
          - name: Carolina
            script: auto_scrapers/scraper_carolinas.py
            args: '--wso "Carolina" --sheet-url "https://docs.google.com/spreadsheets/d/1rKFzpkLCT-FE2SzM0qpUOoZ788YHl7dg/view?gid=1785893123#gid=1785893123"'
          - name: Ohio
            script: auto_scrapers/scraper_ohio.py
            args: '--wso "Ohio" --sheet-url "https://docs.google.com/spreadsheets/d/1fX-Ft3PuLn8BCE2thhwPEXFTEUTN7yJGxWi7LMajAD8/view?gid=0#gid=0"'
          - name: New Jersey
            script: auto_scrapers/scraper_newjersey.py
            args: '--wso "New Jersey" --sheet-url "https://docs.google.com/spreadsheets/d/1y8mXDBLfqmszlzWhv-4wkeWQZS5Kb9Aj4RnB39CBJmw/edit?gid=0#gid=0"'
          - name: Georgia
            script: auto_scrapers/scraper_ga_pnw.py
            args: '--wso "Georgia" --sheet-url "https://docs.google.com/spreadsheets/d/1HM1H51pUmhoWDdSUp2RT-mCaUX2a8NB7aUSYVwWT0AU/edit?gid=908416148#gid=908416148"'
          - name: Pennsylvania-West Virginia
            script: auto_scrapers/scraper_pawv.py
            args: '--wso "Pennsylvania-West Virginia" --sheet-id "2PACX-1vR8exp9-mwi8dpkZa9-48G-CUVuZ5rAlpOYdMCiNMka25wZ6V2XPLurpgMDtyiarqnQxYrW6dWfQ042"'
          - name: Pacific Northwest
            script: auto_scrapers/scraper_ga_pnw.py
            args: '--wso "Pacific Northwest" --sheet-url "https://docs.google.com/spreadsheets/d/1pmZ1j3KJyms0Dlk3xz_VVf6mWq6tqdZj/edit?gid=1648178012#gid=1648178012"'
          - name: California North
            script: auto_scrapers/scraper_ga_pnw.py
            args: '--wso "California North" --sheet-url "https://docs.google.com/spreadsheets/d/1ZAs27jQCPYTVgLuQ-feBHSO-BgGjGCewUs0djG23pXQ/edit?gid=35344992#gid=35344992"'
          - name: New England (auto)
            script: auto_scrapers/scraper_newengland_auto.py
            args: ''
          - name: Mountain South (auto)
            script: auto_scrapers/scraper_mountainsouth_auto.py
            args: ''
          - name: New York (auto)
            script: auto_scrapers/scraper_newyork_auto.py
            args: ''
          - name: Illinois (auto)
            script: auto_scrapers/scraper_illinois_auto.py
            args: ''
    defaults:
      run:
        working-directory: ./scrapers/usaw/wso_sheets_scraper
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper (${{ matrix.name }})
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WSO_WEBHOOK_URL }}
        run: python ${{ matrix.script }} ${{ matrix.args }}
