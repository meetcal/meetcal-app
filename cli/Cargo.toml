[package]
name = "meetcal"
version = "3.0.0"
edition = "2024"
description = "CLI for querying MeetCal lifting data"
homepage = "https://github.com/meetcal/meetcal-app/tree/master/cli"
repository = "https://github.com/meetcal/meetcal-app"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
comfy-table = "7.2.2"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13", features = ["json"] }
unicode-normalization = "0.1.25"
