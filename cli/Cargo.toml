[package]
name = "meetcal"
version = "3.1.0"
edition = "2024"
description = "CLI for querying MeetCal lifting data"
homepage = "https://github.com/meetcal/meetcal-app/tree/master/cli"
repository = "https://github.com/meetcal/meetcal-app"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
comfy-table = "7.2.2"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "http2", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
unicode-normalization = "0.1.25"
sha2 = "0.11.1"
flate2 = "1.1.10"
tar = "0.4.46"

[lints.rust]
unreachable_pub = "deny"
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
wildcard_enum_match_arm = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
