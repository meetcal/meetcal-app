min_version = "2024.11.0"

[tools]
bun = "1.4.0"
node = "24"
java = "17"
ruby = "3.3"

[tasks.setup]
description = "Install dependencies from the lockfile"
run = "bun install --frozen-lockfile"

[tasks.check]
description = "Run the checks this branch's changes need, one worktree at a time (--all for every suite; --plan to inspect)"
run = "bun scripts/check-lock.ts bun scripts/check.ts"

[tasks."app:start"]
description = "Start the Expo development server (waits for the simulator lock)"
run = "bun run start"

[tasks."app:ios"]
description = "Build and run the iOS development client (waits for the simulator lock)"
run = "bun run ios"

[tasks."app:android"]
description = "Build and run the Android development client (waits for the simulator lock)"
run = "bun run android"

[tasks."app:web"]
description = "Start Expo web"
run = "bun run web"

[tasks."app:test"]
description = "Run the Jest CI suite (waits for any other worktree's gate)"
run = "bun scripts/check-lock.ts bun run test:ci"

[tasks."app:test:coverage"]
description = "Run Jest with coverage (waits for any other worktree's gate)"
run = "bun scripts/check-lock.ts bun run test:coverage"

[tasks."app:maestro"]
description = "Run device smoke flows in their own E2E Metro session (waits for the simulator lock)"
run = "bun run maestro:test"

[tasks."convex:dev"]
description = "Start Convex codegen and development watch"
run = "bunx convex dev"

[tasks."app:build:ios"]
description = "Create a production iOS EAS build (see docs/iphone-duo.md for Duo builds)"
run = "bunx eas-cli build --platform ios --profile production"

[tasks."app:build:android"]
description = "Create a production Android EAS build"
run = "bunx eas-cli build --platform android --profile production"

[tasks."app:submit:ios"]
description = "Submit the latest iOS build to App Store Connect"
run = "bunx eas-cli submit --platform ios --latest"

[tasks."app:submit:android"]
description = "Submit the latest Android build to Google Play"
run = "bunx eas-cli submit --platform android --latest"

[tasks."app:update:production"]
description = "Publish a production OTA with the production Convex URL"
run = "bun run update:prod"

[tasks."app:update:preview"]
description = "Publish an OTA to the preview branch with the preview build's Convex URL"
run = "EXPO_PUBLIC_CONVEX_URL=https://disciplined-hare-790.convex.cloud bunx eas-cli update --branch preview"

[tasks."app:update:development"]
description = "Publish an OTA to the development branch with the development build's Convex URL"
run = "EXPO_PUBLIC_CONVEX_URL=https://utmost-retriever-826.convex.cloud bunx eas-cli update --branch development"

[tasks.deploy-ios]
description = "Legacy build-and-submit task; prefer separate app:build:ios and app:submit:ios"
run = "EXPO_NO_CAPABILITY_SYNC=1 bunx eas-cli build --platform ios --profile production && bunx eas-cli submit --platform ios"
[tasks.deploy-android]
description = "Legacy build-and-submit task; prefer separate app:build:android and app:submit:android"
run = "bunx eas-cli build --platform android --profile production && bunx eas-cli submit --platform android"
[tasks.update-prod]
run = "bun run update:prod"
[tasks.update-preview]
run = "mise run app:update:preview"
[tasks.update-dev]
run = "mise run app:update:development"
[tasks.run]
run = "bun run ios"
[tasks.scan]
run = "bunx rnsec scan && bunx react-doctor"
