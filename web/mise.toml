min_version = "2026.9.2"

[tools]
# Cargo runs through mr boxington (mbx, https://mr-boxington.jdx.dev), which
# caches build output across worktrees. Older mise skips the integration. `MBX_DISABLE=1` runs plain Cargo for one command.
rust = { version = "1.99.1", mr_boxington = true }
"mr-boxington" = "1.28.0"
"cargo:cargo-audit" = "0.23.0"
"cargo:trunk" = "0.22.1"
"cargo:leptosfmt" = "0.1.33"
"cargo:wasm-bindgen-cli" = "0.2.130"
node = "24"
"npm:prettier" = "3.10.0"

[tasks.run]
run = "env -u NO_COLOR trunk serve --port 3000 --open"
[tasks.run-schedule-builder]
run = "env -u NO_COLOR trunk serve schedule-builder.html --port 3001 --dist dist-schedule-builder --open"
[tasks.lint]
run = "cargo fmt --all -- --check && cargo clippy --all-targets --locked -- -D warnings"
[tasks.test]
run = "cargo fmt --all -- --check && cargo test"
[tasks.fmt]
run = "cargo leptosfmt"
[tasks.build]
run = "env -u NO_COLOR trunk build --release --locked"
[tasks.audit]
run = "cargo audit"
[tasks.clean]
run = "cargo clean && rm -rf dist dist-schedule-builder"
[tasks.check-all]
run = "cargo fmt --all -- --check && cargo clippy --all-targets --locked -- -D warnings && cargo test"
